  '41': ca_black_saxaul
  '42': ca_ustyurt_desert
  '43': ca_sand_desert
  '44': ca_halophyte
  '45': ca_sand_desert
  '46': ca_loess_semisavanna
  '47': ca_mountain_steppe
  '48': ca_loess_semisavanna
  '49': ca_mountain_steppe
  '50': ca_mountain_steppe
  '51': ca_mountain_steppe
  '52': ca_loess_semisavanna
  '53': ca_loess_semisavanna
  '54': ca_black_saxaul
  '55': ca_loess_semisavanna
