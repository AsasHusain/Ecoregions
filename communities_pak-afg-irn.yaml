  calibrate: GMW v3 union 1996-2020 (996 km2 in the study area). Mangroves line tidal creeks; on the DSM they sit at the same
    height as open mudflats (1-2.5 m), so creek distance separates them. These thresholds map ~2,050 km2 (about 2x GMW; potential
    > current after reduced Indus outflow) and capture ~73% of GMW cells; 23.5% of GMW cells are WorldCover water (mixed creek-edge
    pixels), so ~77% is the ceiling for any land rule. creek_m >= 1 excludes open water.
  priority: 100
