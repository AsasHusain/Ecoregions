# Caucasus & Anatolia (Turkiye, Armenia, Azerbaijan, Georgia): the Pakistan, Afghanistan & Iran library plus
# communities drafted from the literature before any GBIF record of the area was read (Zohary 1973; Davis, Flora of
# Turkey, phytogeographical introduction; Mayer & Aksoy 1986, Walder der Turkei; Atalay 2014, Ecoregions of Turkey;
# Kurschner & Parolly 2012; Nakhutsrishvili 2013, Vegetation of Georgia; Fayvush & Aleksanyan 2016, Habitats of Armenia;
# Prilipko 1970, Azerbaijan; Zazanashvili et al. 2000). New rules are limited to provinces 60-75 or the Iranian
# provinces that continue here (27 Talysh, 30 Hakkari). Thresholds are first guesses, to be calibrated on development
# records (sealed squares excluded).
include: [communities_pak-afg-irn.yaml]

