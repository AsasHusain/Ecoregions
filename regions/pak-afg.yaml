segmentation:
  # Number of L3 units requested per L2 province (expert-tunable). Defaults were
  # set from area and internal heterogeneity; total ~ 300.
  # (v0.3.0: 01, 14, 15 and 16 scaled with the area they gained in Jammu and Kashmir, Ladakh and Shaksgam)
  # (v0.4.0: 07, 08 and 13 scaled with the area they gained in Afghanistan)
  target_units: {"01": 42, "02": 8, "03": 38, "04": 20, "05": 8, "06": 14, "07": 34, "08": 29,
                 "09": 18, "10": 24, "11": 22, "12": 22, "13": 40, "14": 23, "15": 31, "16": 22, "17": 8,
                 "18": 5, "19": 16, "20": 20, "21": 5, "22": 30, "23": 20, "24": 18, "25": 30, "26": 18}

vegcheck:
