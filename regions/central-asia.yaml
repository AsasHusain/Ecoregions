# Central Asia parcel (Turkmenistan, Uzbekistan, Tajikistan, Kyrgyzstan), joined to Pakistan, Afghanistan & Iran at
# the border. Work in progress: the provinces, vegetation rules, geology source and GBIF download below are still those
# copied from the Iran parcel and are replaced before the build. Sealed squares: docs/confirmation/central-asia_sealed.json.

project:
  name: central-asia-ecoregions
  version: "0.1.0"
  area: Central Asia     # map titles              # 0.1.x physiographic; 0.2.0 = first biodiversity-based release
paths:
  raw_region: data/raw/regions/central-asia   # downloads clipped or tiled to this region (git-ignored)
  interim: data/regions/central-asia/interim   # derived rasters on the analysis grid (git-ignored)
  outputs: outputs/central-asia
  qa: outputs/central-asia/qa

crs:
  # Albers equal-area conic centred on Turkmenistan, Uzbekistan, Tajikistan and Kyrgyzstan; standard parallels at 1/6
  # and 5/6 of the latitude span (35.1-45.6 N).
  proj4: "+proj=aea +lat_0=40 +lon_0=66 +lat_1=36.9 +lat_2=43.8 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs"
grid:
  bbox_lonlat: [51.5, 34.2, 81.2, 46.4]  # download / processing extent (W, S, E, N)
  countries: [TKM, UZB, TJK, KGZ]      # Natural Earth ADM0_A3 codes mapped as one continuous area
  overlap: {km: 75, into: [IRN, AFG]}  # parcel: strip into the mapped neighbours, clipped at the join
  inland_seas:                         # water the coast-from-DEM step would call land (below sea level, or lakes); Copernicus flattens each to one height
  - name: Caspian Sea
    level_m: -28.0
    bbox_lonlat: [51.5, 36.4, 55.0, 46.4]   # the Turkmen coast and Garabogazkol (also at -28.0 m in the DEM)
    min_km2: 1000
  # large lakes: Copernicus flattens each to one height (read from the tiles, 2026-11-14); mapped as water, not land
  - {name: Issyk-Kul, level_m: 1606.5, bbox_lonlat: [76.0, 42.1, 78.5, 42.9], min_km2: 500}
  - {name: Aral Sea (western basin), level_m: 27.0, bbox_lonlat: [57.8, 44.0, 59.0, 46.0], min_km2: 300}
  - {name: Sarygamysh, level_m: 5.5, bbox_lonlat: [56.8, 41.2, 58.0, 42.4], min_km2: 300}
  - {name: Aydarkul, level_m: 245.0, bbox_lonlat: [65.8, 40.6, 68.0, 41.2], min_km2: 300}
  - {name: Toktogul Reservoir, level_m: 879.0, bbox_lonlat: [72.4, 41.6, 73.2, 42.0], min_km2: 100}
  - {name: Kairakkum Reservoir, level_m: 344.5, bbox_lonlat: [69.6, 40.1, 70.5, 40.5], min_km2: 100}
  - {name: Song-Kul, level_m: 3014.0, bbox_lonlat: [74.9, 41.7, 75.4, 41.95], min_km2: 100}
  - {name: Karakul, level_m: 3918.5, bbox_lonlat: [73.3, 38.8, 73.7, 39.2], min_km2: 100}
sources:
  natural_earth:
    base: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/10m_cultural
    layers: [ne_10m_admin_0_countries, ne_10m_admin_0_disputed_areas, ne_10m_admin_0_countries_pak, ne_10m_populated_places]
    extensions: [shp, shx, dbf, prj, cpg]
  hydrorivers:   # HydroSHEDS splits Iran between its Asia and Europe & Middle East files
    url: https://data.hydrosheds.org/file/HydroRIVERS/HydroRIVERS_v10_as_shp.zip
    also: [https://data.hydrosheds.org/file/HydroRIVERS/HydroRIVERS_v10_eu_shp.zip]
  hydrobasins:
    url: https://data.hydrosheds.org/file/HydroBASINS/standard/hybas_as_lev01-12_v1c.zip
    also: [https://data.hydrosheds.org/file/HydroBASINS/standard/hybas_eu_lev01-12_v1c.zip]
    levels: [6, 7, 8, 9, 10]
  geology:
    # USGS OFR 97-470C, "Geologic map of South Asia (geo8ag)", ScienceBase item 60c3b89fd34e86b93897ef19
    url: https://www.sciencebase.gov/catalog/file/get/60c3b89fd34e86b93897ef19
    file: geo8ag.zip
    label: USGS geo1ec, geo8ag and geo2cg # short name on maps and in descriptions
    credit: USGS OFR 97-470E geo1ec, OFR 97-470C geo8ag and OFR 97-470G geo2cg
    also:   # Iran: USGS OFR 97-470-G, "Surficial geology of Iran (geo2cg)", ScienceBase 60ad3db2d34e4043c850f2a0, doi:10.5066/P93ZEPFY
      - {url: "https://www.sciencebase.gov/catalog/file/get/60ad3db2d34e4043c850f2a0", file: geo2cg.zip, polygons: geo2cg/geo2cg.shp}
      # Central Asia: USGS OFR 97-470-E, "Generalized geology of the Former Soviet Union (geo1ec)", doi:10.5066/P9GUL0PQ
      - {url: "https://www.sciencebase.gov/catalog/file/get/60ad3d53d34e4043c850f275", file: geo1ec.zip, polygons: geo1ec/geo1ec.shp}
    polygons: geo8apg/geo8apg.shp
    lines: geo8alg/geo8alg.shp
  rgi:  # RGI 7.0 glacier outlines (NSIDC-0770 v7, Earthdata login); zips placed by hand in data/raw/rgi
    files: [RGI2000-v7.0-G-13_central_asia.zip, RGI2000-v7.0-G-14_south_asia_west.zip, RGI2000-v7.0-G-15_south_asia_east.zip]
  gbif_dwca:                  # GBIF occurrence downloads (Darwin Core Archives), one per mapped region;
    # all taxa, occurrence status present, within a drawn polygon plus a margin; mixed licences (raw files
    # never committed). Each unpacked to occurrences_<key>.csv.gz with a `cultivated` flag; the polygons
    # overlap, so readers drop repeated gbifIDs.
    downloads:
      - key: 0005035-261104105008071   # GBIF.org (7 November 2026) GBIF Occurrence Download https://doi.org/10.15468/dl.22b9a4
        doi: 10.15468/dl.22b9a4        # Pakistan, Jammu and Kashmir, Ladakh, Aksai Chin
        url: https://api.gbif.org/v1/occurrence/download/request/0005035-261104105008071.zip
        records: 2847286
      - key: 0007088-261104105008071   # GBIF.org (9 November 2026) GBIF Occurrence Download https://doi.org/10.15468/dl.6t43nn
        doi: 10.15468/dl.6t43nn        # Afghanistan
        url: https://api.gbif.org/v1/occurrence/download/request/0007088-261104105008071.zip
        records: 175987
      - key: 0001335-261110092616502   # GBIF.org (11 November 2026) GBIF Occurrence Download https://doi.org/10.15468/dl.u2kux5
        doi: 10.15468/dl.u2kux5        # Iran plus a margin; all taxa (sealed records filtered out by the confirmation mask)
        url: https://api.gbif.org/v1/occurrence/download/request/0001335-261110092616502.zip
        records: 1646532
      - key: 0007052-261110092616502   # GBIF.org (14 November 2026) GBIF Occurrence Download https://doi.org/10.15468/dl.77g6hc
        doi: 10.15468/dl.77g6hc        # Turkmenistan, Uzbekistan, Tajikistan, Kyrgyzstan plus 0.5 degrees; all taxa (sealed records filtered out)
        url: https://api.gbif.org/v1/occurrence/download/request/0007052-261110092616502.zip
        records: 833901
