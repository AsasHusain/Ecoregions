# Pakistan, Afghanistan & Iran: one continuous area (merged over config.yaml). Built in its own folders from
# regions/pak-afg.yaml, which it will replace once confirmed; Iran's sealed records (docs/confirmation/iran_mask.json)
# are never read while this map is built (docs/preregistration.md).

project:
  name: pak-afg-irn-ecoregions
  version: "0.5.0"
  area: Pakistan, Afghanistan & Iran     # map titles              # 0.1.x physiographic; 0.2.0 = first biodiversity-based release
paths:
  raw_region: data/raw/regions/pak-afg-irn   # downloads clipped or tiled to this region (git-ignored)
  interim: data/regions/pak-afg-irn/interim   # derived rasters on the analysis grid (git-ignored)
  outputs: outputs/pak-afg-irn
  qa: outputs/pak-afg-irn/qa

crs:
  # Albers equal-area conic centred on the three countries; standard parallels at 1/6 and 5/6 of the latitude
  # span (23.5-39.8 N).
  proj4: "+proj=aea +lat_0=32 +lon_0=62 +lat_1=26.2 +lat_2=37.1 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs"
grid:
  bbox_lonlat: [43.8, 23.5, 80.8, 40.0]  # download / processing extent (W, S, E, N)
  countries: [PAK, AFG, IRN]           # Natural Earth ADM0_A3 codes mapped as one continuous area
  inland_seas:                         # below-sea-level water the coast-from-DEM step would call land; Copernicus flattens it to one height
  - name: Caspian Sea
    level_m: -28.0
    bbox_lonlat: [46.5, 36.4, 54.5, 40.0]   # to the processing box's north edge; Lake Urmia (45.5 E, now mostly salt flat) stays land, outside the box
    min_km2: 1000
sources:
  natural_earth:
    base: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/10m_cultural
    layers: [ne_10m_admin_0_countries, ne_10m_admin_0_disputed_areas, ne_10m_admin_0_countries_pak, ne_10m_populated_places]
    extensions: [shp, shx, dbf, prj, cpg]
  hydrorivers:   # HydroSHEDS splits Iran between its Asia and Europe & Middle East files
    url: https://data.hydrosheds.org/file/HydroRIVERS/HydroRIVERS_v10_as_shp.zip
    also: [https://data.hydrosheds.org/file/HydroRIVERS/HydroRIVERS_v10_eu_shp.zip]
  hydrobasins:
    url: https://data.hydrosheds.org/file/HydroBASINS/standard/hybas_as_lev01-12_v1c.zip
    also: [https://data.hydrosheds.org/file/HydroBASINS/standard/hybas_eu_lev01-12_v1c.zip]
    levels: [6, 7, 8, 9, 10]
  geology:
    # USGS OFR 97-470C, "Geologic map of South Asia (geo8ag)", ScienceBase item 60c3b89fd34e86b93897ef19
    url: https://www.sciencebase.gov/catalog/file/get/60c3b89fd34e86b93897ef19
    file: geo8ag.zip
    label: USGS geo8ag and geo2cg # short name on maps and in descriptions
    credit: USGS OFR 97-470C geo8ag and OFR 97-470G geo2cg
    also:   # Iran: USGS OFR 97-470-G, "Surficial geology of Iran (geo2cg)", ScienceBase 60ad3db2d34e4043c850f2a0, doi:10.5066/P93ZEPFY
      - {url: "https://www.sciencebase.gov/catalog/file/get/60ad3db2d34e4043c850f2a0", file: geo2cg.zip, polygons: geo2cg/geo2cg.shp}
    polygons: geo8apg/geo8apg.shp
    lines: geo8alg/geo8alg.shp
  rgi:  # RGI 7.0 glacier outlines (NSIDC-0770 v7, Earthdata login); zips placed by hand in data/raw/rgi
    files: [RGI2000-v7.0-G-13_central_asia.zip, RGI2000-v7.0-G-14_south_asia_west.zip, RGI2000-v7.0-G-15_south_asia_east.zip]
  gbif_dwca:                  # GBIF occurrence downloads (Darwin Core Archives), one per mapped region;
    # all taxa, occurrence status present, within a drawn polygon plus a margin; mixed licences (raw files
    # never committed). Each unpacked to occurrences_<key>.csv.gz with a `cultivated` flag; the polygons
    # overlap, so readers drop repeated gbifIDs.
    downloads:
      - key: 0005035-261104105008071   # GBIF.org (7 November 2026) GBIF Occurrence Download https://doi.org/10.15468/dl.22b9a4
        doi: 10.15468/dl.22b9a4        # Pakistan, Jammu and Kashmir, Ladakh, Aksai Chin
        url: https://api.gbif.org/v1/occurrence/download/request/0005035-261104105008071.zip
        records: 2847286
      - key: 0007088-261104105008071   # GBIF.org (9 November 2026) GBIF Occurrence Download https://doi.org/10.15468/dl.6t43nn
        doi: 10.15468/dl.6t43nn        # Afghanistan
        url: https://api.gbif.org/v1/occurrence/download/request/0007088-261104105008071.zip
        records: 175987
      - key: 0001335-261110092616502   # GBIF.org (11 November 2026) GBIF Occurrence Download https://doi.org/10.15468/dl.u2kux5
        doi: 10.15468/dl.u2kux5        # Iran plus a margin; all taxa (sealed records filtered out by the confirmation mask)
        url: https://api.gbif.org/v1/occurrence/download/request/0001335-261110092616502.zip
        records: 1646532
