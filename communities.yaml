# Potential natural vegetation communities of Pakistan, AJK and Gilgit-Baltistan
# (LANDFIRE-BpS-like layer at 90 m).                         STATUS: DRAFT v0 for expert review
#
# Each community is mapped by explicit rules on the v0.1 rasters. A cell takes the
# matching community with the highest `priority`; unmatched cells fall back to the
# province default (`fallback`). Thresholds are first guesses from the literature
# and are to be calibrated against GMW v3, Jung et al. habitat lvl2, Hengl PNV and
# HUP / Punjab plot records — every number here is provisional.
#
# Group = Champion, Seth & Khattak (1965) forest-type group (or the non-forest
# formation where CSK has none). Exact CSK sub-type codes still to be checked
# against the book: left out rather than guessed.
#
# Rule keys (all conditions AND; [min, max), null = open):
#   elev      m          dem                         slope   deg     slope
#   bio1      degC       clim_bio1 (MAT)             bio12   mm/yr   clim_bio12 (MAP)
#   ai        -          clim_ai (aridity index)     gdd5    degC d  clim_gdd5
#   hand      class      hand_class names            litho   codes   geo_litho (1 alluvium, 2 aeolian sand, 3 molasse,
#                                                                    4 Paleogene, 5 Mesozoic, 6 metased., 7 intrusive,
#                                                                    8 volcanic, 9 Paleozoic, 10 basement, 11 water/ice)
#   province  L2 codes   l2                          dune    bool    dune texture mask
#   coast_km  km         distance to sea (NEW, from mask)
#   northness -1..1      cos(aspect) (NEW, from dem; + = north-facing)
#   river_km  km         distance to a major river channel (NEW, flow accumulation >= 8,000 km2)
#   creek_m   m          distance to open or tidal water (NEW, WorldCover water class + sea; water itself = 0)
# L2: 01 Upper Indus Plain, 02 Thal, 03 Lower Indus+Delta, 04 Thar-Cholistan, 05 Kachhi-Sibi,
#     06 Potohar-Salt Range, 07 NW basins/ranges, 08 Sulaiman-Toba Kakar, 09 Kirthar-Pab-Lasbela,
#     10 Central Balochistan uplands, 11 Kharan-Chagai, 12 Makran, 13 Hindu Kush-Swat-Dir,
#     14 Karakoram, 15 Western Himalaya, 16 Lesser Himalaya-Siwalik, 17 Derajat

communities:

  # ---------------- Littoral and swamp ----------------
  - id: mangrove
    ecoregion: delta_mangroves
    name: Indus Delta and Arabian Sea mangroves
    group: Littoral and swamp forests
    indicators: [Avicennia marina, Rhizophora mucronata, Ceriops tagal, Aegiceras corniculatum]
    where: {coast_km: [null, 25], elev: [null, 4], creek_m: [1, 720]}
    calibrate: >-
      GMW v3 union 1996-2020 (996 km2 in the study area). Mangroves line tidal creeks; on the DSM they
      sit at the same height as open mudflats (1-2.5 m), so creek distance separates them. These
      thresholds map ~2,050 km2 (about 2x GMW; potential > current after reduced Indus outflow) and
      capture ~73% of GMW cells; 23.5% of GMW cells are WorldCover water (mixed creek-edge pixels),
      so ~77% is the ceiling for any land rule. creek_m >= 1 excludes open water.
    priority: 100
  - id: coastal_halophyte
    ecoregion: delta_mangroves
    name: Coastal salt-flat halophytic scrub
    group: Littoral and swamp forests (non-forest)
    indicators: [Arthrocnemum macrostachyum, Suaeda fruticosa, Salsola imbricata, Aeluropus lagopoides]
    where: {coast_km: [null, 40], elev: [null, 8], slope: [null, 2]}
    priority: 90
  - id: coastal_dune
    ecoregion: delta_mangroves
    name: Coastal dune and beach scrub
    group: Littoral and swamp forests (non-forest)
    indicators: [Ipomoea pes-caprae, Halopyrum mucronatum, Urochondra setulosa]
    where: {coast_km: [null, 3], elev: [null, 30], litho: [1, 2]}
    priority: 95

  # ---------------- Riverine and wetland ----------------
  - id: riverine_forest
    ecoregion: riverine
    name: Indus riverine (bela) forest
    group: Tropical thorn forests (riverain)
    indicators: [Populus euphratica, Tamarix dioica, Acacia nilotica, Dalbergia sissoo, Saccharum spontaneum]
    where: {hand: [active_floodplain], river_km: [null, 5], elev: [null, 600], province: ["01", "02", "03", "17"]}
    note: river_km keeps it to the kacho/bela belt between the flood embankments (~10-20 km wide on the Indus);
      HAND alone is < 2 m across much of the flat lower plains. Not in the Kachhi (05), whose Nari is a hill torrent.
    priority: 80
  - id: highland_riparian
    ecoregion: dry_alpine
    name: High-valley riparian thickets
    group: Himalayan dry temperate (riparian)
    indicators: [Hippophae rhamnoides, Myricaria germanica, Salix spp., Populus ciliata]
    where: {hand: [active_floodplain], elev: [1200, 3800], province: ["13", "14", "15"]}
    priority: 80
  - id: playa_halophyte
    ecoregion: chagai_kharan
    name: Inland saline basins (hamun) and salt pans
    group: Desert (non-forest)
    indicators: [Tamarix aphylla, Haloxylon stocksii, Suaeda fruticosa, Salsola spp.]
    where: {province: ["10", "11", "12"], slope: [null, 0.5], hand: [active_floodplain]}
    note: Hamun-i-Mashkel, Hamun-i-Lora etc. HAND on endorheic flats is weak; may need a depression mask.
    priority: 85

  # ---------------- Plains and deserts ----------------
  - id: plains_thorn
    ecoregion: indus_thorn
    name: Indus plains tropical thorn forest
    group: Tropical thorn forests
    indicators: [Prosopis cineraria, Salvadora oleoides, Capparis decidua, Tamarix aphylla, Ziziphus mauritiana]
    where: {province: ["01", "03", "05", "07", "17"], elev: [null, 700], slope: [null, 3], dune: false}
    priority: 20
  - id: thal_sand
    ecoregion: thal
    name: Thal sand-desert scrub
    group: Tropical thorn forests (desert)
    indicators: [Calligonum polygonoides, Leptadenia pyrotechnica, Aerva javanica, Prosopis cineraria, Haloxylon salicornicum]
    where: {province: ["02"]}
    priority: 30
  - id: cholistan_thar_dune
    ecoregion: thar_cholistan
    name: Cholistan-Thar dune scrub
    group: Tropical thorn forests (desert)
    indicators: [Calligonum polygonoides, Leptadenia pyrotechnica, Aerva javanica, Dipterygium glaucum, Lasiurus scindicus]
    where: {province: ["04"], dune: true}
    priority: 35
  - id: thar_interdune
    ecoregion: thar_cholistan
    name: Thar-Cholistan interdune thorn parkland
    group: Tropical thorn forests
    indicators: [Prosopis cineraria, Salvadora oleoides, Capparis decidua, Ziziphus nummularia]
    where: {province: ["04"], dune: false}
    priority: 30
  - id: kachhi_desert_thorn
    ecoregion: kachhi
    name: Kachhi-Sibi arid thorn scrub
    group: Tropical thorn forests (desert)
    indicators: [Prosopis cineraria, Capparis decidua, Rhazya stricta, Salvadora persica]
    where: {province: ["05"], bio12: [null, 200]}
    priority: 25
  - id: nagarparkar_granite
    ecoregion: thar_cholistan
    name: Nagarparkar granite hill scrub
    group: Tropical thorn forests
    indicators: [Euphorbia caducifolia, Acacia senegal, Commiphora wightii, Grewia tenax]
    where: {province: ["04"], litho: [10], slope: [5, null]}
    note: below geo8ag resolution (v0.1 weakness 4); needs a hand-drawn or 1:250k geology mask.
    priority: 60

  # ---------------- Low hills and piedmont (dry tropical / subtropical) ----------------
  - id: euphorbia_hill_scrub
    ecoregion: kirthar_lasbela
    name: Kirthar-Pab limestone hill scrub
    group: Tropical thorn forests (Euphorbia scrub)
    indicators: [Euphorbia caducifolia, Acacia senegal, Commiphora wightii, Grewia tenax, Nannorrhops ritchiana]
    where: {province: ["09"], elev: [100, 1200], slope: [3, null]}
    priority: 40
  - id: lasbela_thorn
    ecoregion: kirthar_lasbela
    name: Lasbela and Hab valley thorn scrub
    group: Tropical thorn forests
    indicators: [Prosopis cineraria, Salvadora persica, Acacia nilotica, Capparis decidua]
    where: {province: ["09"], slope: [null, 3]}
    priority: 30
  - id: makran_coastal_scrub
    ecoregion: makran_coast
    name: Makran coastal desert scrub
    group: Tropical thorn forests (desert)
    indicators: [Euphorbia caducifolia, Prosopis cineraria, Salvadora persica, Capparis decidua, Acacia tortilis]
    where: {province: ["12"], coast_km: [null, 60], elev: [null, 600]}
    priority: 35
  - id: makran_range_scrub
    ecoregion: makran_ranges
    name: Makran ranges dwarf-palm and thorn scrub
    group: Tropical thorn forests (desert)
    indicators: [Nannorrhops ritchiana, Acacia nilotica, Ziziphus nummularia, Periploca aphylla]
    where: {province: ["12"]}
    priority: 25
  - id: sulaiman_piedmont_scrub
    ecoregion: sulaiman_piedmont
    name: Sulaiman-Bugti piedmont thorn scrub
    group: Tropical thorn forests
    indicators: [Acacia modesta, Prosopis cineraria, Capparis decidua, Rhazya stricta, Nannorrhops ritchiana]
    where: {province: ["08", "17"], elev: [null, 900], bio12: [null, 350]}
    priority: 30
  - id: olea_acacia_scrub
    ecoregion: olive_scrub
    name: Subtropical olive-phulai scrub forest
    group: Subtropical broadleaved evergreen (dry) forests
    indicators: [Olea ferruginea, Acacia modesta, Dodonaea viscosa, Monotheca buxifolia, Gymnosporia royleana]
    where: {elev: [400, 1600], bio12: [350, null], province: ["06", "07", "08", "13", "16"]}
    note: Salt Range, Kala Chitta, Margalla, Kohat, lower Hazara/Swat/Dir, Sulaiman foothills.
    priority: 40
  - id: siwalik_dry_deciduous
    ecoregion: siwalik
    name: Siwalik dry deciduous scrub forest
    group: Tropical dry deciduous forests
    indicators: [Acacia catechu, Bombax ceiba, Mallotus philippensis, Lannea coromandelica, Flacourtia indica]
    where: {province: ["16"], elev: [null, 900], bio12: [800, null]}
    priority: 45
  - id: potohar_plateau_scrub
    ecoregion: olive_scrub
    name: Potohar plateau thorn and Acacia scrub
    group: Tropical thorn forests
    indicators: [Acacia modesta, Acacia nilotica, Ziziphus nummularia, Prosopis cineraria, Capparis decidua]
    where: {province: ["06"], elev: [null, 600]}
    priority: 30

  # ---------------- Balochistan uplands (dry temperate / xeric) ----------------
  - id: ziarat_juniper
    ecoregion: juniper
    name: Ziarat juniper woodland
    group: Himalayan dry temperate forests (juniper)
    indicators: [Juniperus excelsa subsp. polycarpos, Fraxinus xanthoxyloides, Pistacia khinjuk, Artemisia maritima]
    where: {province: ["08", "10"], elev: [2000, 3000], slope: [4, null]}
    note: >-
      Ziarat, Zarghun, Khalifat, Takatu, Shaidu, Murdar, Chiltan; ~2,000-3,000 m in the literature.
      LOW CONFIDENCE: no GBIF/HUP Juniperus record falls in Balochistan (all 45 are in Gilgit-Baltistan
      and the Western Himalaya), so the extent rests on the literature alone.
    priority: 70
  - id: chilgoza_pine
    ecoregion: dry_temperate
    name: Chilgoza pine forest
    group: Himalayan dry temperate forests
    indicators: [Pinus gerardiana, Quercus baloot, Cedrus deodara, Fraxinus xanthoxyloides]
    where: {elev: [1800, 3350], bio12: [200, 700], slope: [12, null], province: ["07", "08", "13", "14", "15"]}
    note: >-
      Sulaiman (Takht-i-Sulaiman, Shinghar), Zhob, Kurram, Waziristan, Chitral, Dir Kohistan, Astore and
      Gilgit side valleys. IUCN 2,000-3,350 m. Steep rocky slopes. GBIF (HUP, ~10 km precision): 10 of 12
      records in L2 15, none in Balochistan (no herbarium coverage there, not absence).
      Ranked below northern dry juniper and cold-desert valley scrub so that in the north it keeps
      only the moister lower slopes (at priority 68 it took 12,900 km2 of Gilgit-Hunza slopes).
    priority: 56
  - id: pistacia_fraxinus_woodland
    ecoregion: xeric_woodland
    name: Pistacia-Fraxinus xeric woodland
    group: Himalayan dry temperate forests (xeric scrub)
    indicators: [Pistacia khinjuk, Pistacia atlantica, Fraxinus xanthoxyloides, Amygdalus brahuica, Prunus eburnea]
    where: {province: ["08", "10", "11"], elev: [1100, 2200], slope: [5, null]}
    priority: 50
  - id: balochistan_artemisia_steppe
    ecoregion: artemisia
    name: Balochistan plateau Artemisia steppe
    group: Desert (dwarf-shrub steppe)
    indicators: [Artemisia sieberi, Haloxylon griffithii, Convolvulus leiocalycinus, Stipa spp., Caragana ambigua]
    where: {province: ["08", "10", "11"], elev: [1200, 3000], slope: [null, 5]}
    priority: 45
  - id: kharan_sand_desert
    ecoregion: chagai_kharan
    name: Kharan sand desert
    group: Desert
    indicators: [Haloxylon salicornicum, Calligonum spp., Stipagrostis plumosa, Tamarix aphylla]
    where: {province: ["11"], dune: true}
    priority: 40
  - id: chagai_gravel_desert
    ecoregion: chagai_kharan
    name: Chagai-Kharan gravel desert (hammada)
    group: Desert
    indicators: [Haloxylon griffithii, Zygophyllum eurypterum, Rhazya stricta, Ephedra intermedia]
    where: {province: ["11"]}
    priority: 20

  # ---------------- Himalaya / Hindu Kush / Karakoram ----------------
  - id: chir_pine
    ecoregion: chir
    name: Chir pine forest
    group: Subtropical pine forests
    indicators: [Pinus roxburghii, Myrsine africana, Carissa opaca, Berberis lycium]
    where: {elev: [900, 1800], bio12: [800, null], province: ["07", "13", "15", "16"]}
    priority: 55
  - id: oak_moist_temperate
    ecoregion: moist_temperate
    name: Ban oak and mixed broadleaf forest
    group: Himalayan moist temperate forests
    indicators: [Quercus incana, Quercus dilatata, Rhododendron arboreum, Pyrus pashia]
    where: {elev: [1500, 2400], bio12: [1000, null], province: ["13", "15", "16"]}
    priority: 58
  - id: deodar_bluepine_moist
    ecoregion: moist_temperate
    name: Deodar-blue pine moist temperate forest
    group: Himalayan moist temperate forests
    indicators: [Cedrus deodara, Pinus wallichiana, Juglans regia, Aesculus indica]
    where: {elev: [1800, 3000], bio12: [800, null], province: ["07", "13", "15", "16"]}
    priority: 60
  - id: fir_spruce
    ecoregion: moist_temperate
    name: Fir-spruce moist temperate forest
    group: Himalayan moist temperate forests
    indicators: [Abies pindrow, Picea smithiana, Taxus wallichiana, Acer caesium]
    where: {elev: [2400, 3400], bio12: [900, null], northness: [-0.2, null], province: ["13", "14", "15", "16"]}
    note: GBIF (HUP) - Picea smithiana 23 of 38 and Abies pindrow 6 of 27 records in Karakoram side valleys (L2 14).
    priority: 65
  - id: deodar_dry
    ecoregion: dry_temperate
    name: Dry deodar and blue pine forest
    group: Himalayan dry temperate forests
    indicators: [Cedrus deodara, Pinus wallichiana, Quercus baloot, Juniperus excelsa]
    where: {elev: [1900, 3300], bio12: [400, 800], province: ["07", "13", "14", "15"]}
    note: Chitral, Kurram, Astore, Gilgit side valleys.
    priority: 62
  - id: holly_oak
    ecoregion: dry_temperate
    name: Holly oak (baloot) dry woodland
    group: Himalayan dry temperate forests
    indicators: [Quercus baloot, Olea ferruginea, Fraxinus xanthoxyloides, Daphne mucronata]
    where: {elev: [1400, 2400], bio12: [350, 900], province: ["07", "08", "13"]}
    priority: 56
  - id: dry_juniper_north
    ecoregion: dry_alpine
    name: Northern dry juniper woodland
    group: Himalayan dry temperate forests (juniper)
    indicators: [Juniperus excelsa subsp. polycarpos, Juniperus semiglobosa, Ephedra gerardiana, Artemisia brevifolia]
    where: {elev: [2800, 4000], bio12: [150, 600], province: ["13", "14", "15"]}
    priority: 63
  - id: subalpine_birch
    ecoregion: subalpine_alpine
    name: Subalpine birch-fir forest
    group: Sub-alpine forests
    indicators: [Betula utilis, Abies pindrow, Salix denticulata, Rhododendron campanulatum]
    where: {elev: [3200, 3900], bio12: [600, null], province: ["13", "14", "15", "16"]}
    priority: 68
  - id: moist_alpine
    ecoregion: subalpine_alpine
    name: Moist alpine meadow and scrub
    group: Alpine scrub (moist)
    indicators: [Rhododendron anthopogon, Salix lindleyana, Primula spp., Polygonum affine, Juniperus squamata]
    where: {elev: [3600, 4800], bio12: [600, null], province: ["13", "15", "16"]}
    note: CHELSA shows high snowfall at Karakoram altitudes, so precipitation alone would make the Karakoram 'moist'.
    priority: 66
  - id: dry_alpine
    ecoregion: dry_alpine
    name: Dry alpine steppe and scrub
    group: Alpine scrub (dry)
    indicators: [Juniperus squamata, Caragana versicolor, Ephedra gerardiana, Artemisia spp., Astragalus spp.]
    where: {elev: [3600, 4900]}
    note: includes Deosai plateau unless a separate plateau type is warranted.
    priority: 66
  - id: cold_desert_valley
    ecoregion: dry_alpine
    name: Karakoram-Hindu Kush cold-desert valley scrub
    group: Desert (cold)
    indicators: [Artemisia brevifolia, Capparis spinosa, Ephedra intermedia, Peganum harmala, Haloxylon thomsonii]
    where: {elev: [1200, 3000], bio12: [null, 400], province: ["13", "14", "15"]}
    note: Gilgit, Hunza, Skardu, Chitral valley floors; rain-shadow.
    priority: 57
  - id: nival
    ecoregion: ice
    name: Nival zone, glaciers and rock
    group: Nival (non-vegetated)
    indicators: []
    where: {elev: [4900, null]}
    note: litho 11 (water/ice) also; RGI v7 would sharpen this.
    priority: 99

# Ecoregion types: mappable aggregations of the communities above (each community
# names its type in `ecoregion`). Biomes follow RESOLVE Ecoregions 2017.
ecoregion_types:
  delta_mangroves: {name: "Indus Delta–Arabian Sea mangroves and salt flats", biome: "Mangroves", color: "#2a9d8f"}
  riverine: {name: "Indus riverine forests", biome: "Tropical & Subtropical Dry Broadleaf Forests", color: "#57a773"}
  indus_thorn: {name: "Indus plains thorn forests", biome: "Deserts & Xeric Shrublands", color: "#c9b46a"}
  thal: {name: "Thal sand desert", biome: "Deserts & Xeric Shrublands", color: "#e9c46a"}
  thar_cholistan: {name: "Thar–Cholistan desert", biome: "Deserts & Xeric Shrublands", color: "#f4a259"}
  kachhi: {name: "Kachhi–Sibi arid thorn scrub", biome: "Deserts & Xeric Shrublands", color: "#d4a373"}
  kirthar_lasbela: {name: "Kirthar–Lasbela hill and valley scrub", biome: "Deserts & Xeric Shrublands", color: "#b5838d"}
  makran_coast: {name: "Makran coastal desert", biome: "Deserts & Xeric Shrublands", color: "#e5b98a"}
  makran_ranges: {name: "Makran ranges dwarf-palm scrub", biome: "Deserts & Xeric Shrublands", color: "#a68a64"}
  sulaiman_piedmont: {name: "Sulaiman–Bugti piedmont scrub", biome: "Deserts & Xeric Shrublands", color: "#9c6644"}
  olive_scrub: {name: "Subtropical olive–phulai scrub forests", biome: "Tropical & Subtropical Dry Broadleaf Forests", color: "#8a9a5b"}
  siwalik: {name: "Siwalik dry deciduous forests", biome: "Tropical & Subtropical Dry Broadleaf Forests", color: "#a7c957"}
  juniper: {name: "Balochistan juniper woodlands", biome: "Temperate Conifer Forests", color: "#386641"}
  xeric_woodland: {name: "Balochistan pistachio–ash xeric woodlands", biome: "Deserts & Xeric Shrublands", color: "#6b705c"}
  artemisia: {name: "Balochistan plateau Artemisia steppe", biome: "Deserts & Xeric Shrublands", color: "#a3b18a"}
  chagai_kharan: {name: "Chagai–Kharan deserts and hamuns", biome: "Deserts & Xeric Shrublands", color: "#f2e3bc"}
  chir: {name: "Himalayan chir pine forests", biome: "Tropical & Subtropical Coniferous Forests", color: "#6a994e"}
  moist_temperate: {name: "Western Himalayan moist temperate forests", biome: "Temperate Conifer Forests", color: "#1b4332"}
  dry_temperate: {name: "Hindu Kush–Sulaiman dry temperate forests", biome: "Temperate Conifer Forests", color: "#52796f"}
  subalpine_alpine: {name: "Himalayan subalpine forests and alpine meadows", biome: "Montane Grasslands & Shrublands", color: "#95d5b2"}
  dry_alpine: {name: "Karakoram–Hindu Kush dry alpine steppe and cold desert", biome: "Montane Grasslands & Shrublands", color: "#b8a9c9"}
  ice: {name: "Karakoram glaciers and rock", biome: "Rock and Ice", color: "#e8f1f8"}

# Province fallbacks for cells no rule claims (reported as low-confidence).
fallback:
  "01": plains_thorn
  "02": thal_sand
  "03": plains_thorn
  "04": thar_interdune
  "05": kachhi_desert_thorn
  "06": olea_acacia_scrub
  "07": olea_acacia_scrub
  "08": sulaiman_piedmont_scrub
  "09": euphorbia_hill_scrub
  "10": balochistan_artemisia_steppe
  "11": chagai_gravel_desert
  "12": makran_range_scrub
  "13": holly_oak
  "14": cold_desert_valley
  "15": deodar_dry
  "16": chir_pine
  "17": sulaiman_piedmont_scrub
