# Potential natural vegetation communities of Pakistan, AJK and Gilgit-Baltistan
# (LANDFIRE-BpS-like layer at 90 m).                         STATUS: DRAFT v0 for expert review
#
# Each community is mapped by explicit rules on the v0.1 rasters. A cell takes the
# matching community with the highest `priority`; unmatched cells fall back to the
# province default (`fallback`). Thresholds are first guesses from the literature
# and are to be calibrated against GMW v3, Jung et al. habitat lvl2, Hengl PNV and
# HUP / Punjab plot records — every number here is provisional.
#
# Indicators: species characteristic of the community, named as in the GBIF backbone (so GBIF
# records match; e.g. Senegalia modesta = Acacia modesta, Quercus floribunda = Q. dilatata,
# Sideroxylon mascatense = Monotheca buxifolia, Olea europaea = O. ferruginea). Ubiquitous or
# widely planted species (Peganum harmala, Capparis spinosa, Dalbergia sissoo, Juglans regia ...)
# are left out: they cannot tell one community from another.
#
# Group = Champion, Seth & Khattak (1965) forest-type group (or the non-forest
# formation where CSK has none). Exact CSK sub-type codes still to be checked
# against the book: left out rather than guessed.
#
# Rule keys (all conditions AND; [min, max), null = open):
#   elev      m          dem                         slope   deg     slope
#   bio1      degC       clim_bio1 (MAT)             bio12   mm/yr   clim_bio12 (MAP)
#   ai        -          clim_ai (aridity index)     gdd5    degC d  clim_gdd5
#   hand      class      hand_class names            litho   codes   geo_litho (1 alluvium, 2 aeolian sand, 3 molasse,
#                                                                    4 Paleogene, 5 Mesozoic, 6 metased., 7 intrusive,
#                                                                    8 volcanic, 9 Paleozoic, 10 basement, 11 water/ice)
#   province  L2 codes   l2                          dune    bool    dune texture mask
#   coast_km  km         distance to sea (NEW, from mask)
#   northness -1..1      cos(aspect) (NEW, from dem; + = north-facing)
#   tpi       m          height above the mean within 450 m (tpi_450; negative = hollow)
#   river_km  km         distance to a major river channel (NEW, flow accumulation >= 8,000 km2)
#   creek_m   m          distance to open or tidal water (NEW, WorldCover water class + sea; water itself = 0)
# L2: 01 Upper Indus Plain, 02 Thal, 03 Lower Indus Plain and Delta, 04 Thar, 05 Kachhi,
#     06 Potohar, 07 NW basins/ranges, 08 Sulaiman, 09 Kirthar, 10 Central Balochistan uplands,
#     11 Kharan, 12 Makran, 13 Hindu Kush, 14 Karakoram, 15 Western Himalaya, 16 Lesser Himalaya,
#     17 Derajat, 18 Kashmir Valley, 19 Ladakh Ranges, 20 Western Tibetan Plateau, 21 Pamir,
#     22 Hazarajat, 23 Amu Darya Plains, 24 Paropamisus, 25 Helmand Basin, 26 Ghazni Plateau
#     (07 Peshawar, 08 Sulaiman and 13 Hindu Kush extend into Afghanistan)

# structure: the community's physiognomy, for the global biome key (biomes.py): forest_conifer, forest_broadleaf,
#   woodland_conifer, woodland_broadleaf (open tree cover), savanna, shrubland, grassland, sparse (desert, dunes, salt
#   flats, outcrops), wetland (herbaceous), mangrove, alpine (above the treeline), ice. Set from each community's
#   description and sources, never from test data.
communities:

  # ---------------- Littoral and swamp ----------------
  - id: mangrove
    structure: mangrove
    ecoregion: delta_mangroves
    name: Indus Delta and Arabian Sea mangroves
    group: Littoral and swamp forests
    indicators: [Avicennia marina, Rhizophora mucronata, Ceriops tagal, Aegiceras corniculatum]
    where: {coast_km: [null, 25], elev: [null, 4], creek_m: [1, 720]}
    calibrate: >-
      GMW v3 union 1996-2020 (996 km2 in the study area). Mangroves line tidal creeks; on the DSM they
      sit at the same height as open mudflats (1-2.5 m), so creek distance separates them. These
      thresholds map ~2,050 km2 (about 2x GMW; potential > current after reduced Indus outflow) and
      capture ~73% of GMW cells; 23.5% of GMW cells are WorldCover water (mixed creek-edge pixels),
      so ~77% is the ceiling for any land rule. creek_m >= 1 excludes open water.
    priority: 100
  - id: coastal_halophyte
    structure: sparse
    ecoregion: delta_mangroves
    name: Coastal salt-flat halophytic scrub
    group: Littoral and swamp forests (non-forest)
    indicators: [Arthrocaulon macrostachyum, Suaeda fruticosa, Caroxylon imbricatum]
    where: {coast_km: [null, 40], elev: [null, 8], slope: [null, 2]}
    priority: 90
  - id: coastal_dune
    structure: sparse
    ecoregion: delta_mangroves
    name: Coastal dune and beach scrub
    group: Littoral and swamp forests (non-forest)
    indicators: [Ipomoea pes-caprae, Halopyrum mucronatum, Urochondra setulosa]
    where: {coast_km: [null, 3], elev: [null, 30], litho: [1, 2]}
    priority: 95

  # ---------------- Riverine and wetland ----------------
  - id: riverine_forest
    structure: forest_broadleaf
    ecoregion: riverine
    name: Indus riverine (bela) forest
    group: Tropical thorn forests (riverain)
    indicators: [Populus euphratica, Tamarix dioica, Vachellia nilotica]
    where: {hand: [active_floodplain], river_km: [null, 5], elev: [null, 600], province: ["01", "02", "03", "17"]}
    note: river_km keeps it to the kacho/bela belt between the flood embankments (~10-20 km wide on the Indus);
      HAND alone is < 2 m across much of the flat lower plains. Not in the Kachhi (05), whose Nari is a hill torrent.
    priority: 80
  - id: highland_riparian
    structure: shrubland
    ecoregion: dry_alpine
    name: High-valley riparian thickets
    group: Himalayan dry temperate (riparian)
    indicators: [Hippophae rhamnoides, Myricaria germanica, Salix spp., Populus ciliata]
    where: {hand: [active_floodplain], elev: [1200, 3800], province: ["13", "14", "15", "19", "21"]}
    priority: 80
  - id: playa_halophyte
    structure: sparse
    ecoregion: chagai_kharan
    name: Inland saline basins (hamun) and salt pans
    group: Desert (non-forest)
    indicators: [Tamarix aphylla, Haloxylon stocksii, Suaeda fruticosa, Salsola spp.]
    where: {province: ["10", "11", "12"], slope: [null, 0.5], hand: [active_floodplain]}
    note: Hamun-i-Mashkel, Hamun-i-Lora etc. HAND on endorheic flats is weak; may need a depression mask.
    priority: 85

