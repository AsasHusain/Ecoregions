    indicators: [Pinus gerardiana, Quercus baloot, Cedrus deodara, Fraxinus xanthoxyloides]
    where: {elev: [1800, 3350], bio12: [200, 700], slope: [12, null], province: ["07", "08"]}
    note: >-
      Sulaiman (Takht-i-Sulaiman, Shinghar), Zhob, Kurram, Waziristan. IUCN 2,000-3,350 m. Steep rocky
      slopes. Hardly any herbarium records here (no coverage, not absence); envelope from the literature.
    priority: 56
  - id: chilgoza_pine_north
    structure: forest_conifer
    ecoregion: northern_dry_temperate
