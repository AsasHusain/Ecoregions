# Ecoregion types: mappable aggregations of the communities above (each community
# names its type in `ecoregion`). Biomes follow RESOLVE Ecoregions 2017. Names as presented on maps:
# Title Case, "&" for "and", at most one place name (the region a type is centred on; when a type
# spreads beyond it, rename it to the enclosing region rather than adding another place). `resolve` lists
# the RESOLVE ecoregions a type can plausibly lie in (generous: RESOLVE is coarse, and
# neighbouring zones count); the audit flags ecoregions mostly outside them for review.
ecoregion_types:
  delta_mangroves: {name: "Arabian Sea Mangroves & Salt Flats", biome: "Mangroves", color: "#2a9d8f",
    resolve: ["Indus River Delta-Arabian Sea mangroves", "Rann of Kutch seasonal salt marsh", "South Iran Nubo-Sindian desert and semi-desert"]}
  riverine: {name: "Indus Riverine Forests", biome: "Tropical & Subtropical Dry Broadleaf Forests", color: "#57a773",
    resolve: ["Aravalli west thorn scrub forests", "Indus Valley desert", "Thar desert", "Rann of Kutch seasonal salt marsh"]}
  indus_thorn: {name: "Indus Plains Thorn Forests", biome: "Deserts & Xeric Shrublands", color: "#c9b46a",
    resolve: ["Aravalli west thorn scrub forests", "Indus Valley desert", "Thar desert", "Rann of Kutch seasonal salt marsh"]}
