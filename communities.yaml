    indicators: [Pinus gerardiana, Quercus baloot, Cedrus deodara, Fraxinus xanthoxyloides]
    where: {elev: [1700, 3000], bio12: [300, 700], slope: [25, null], province: ["13", "14", "15"]}
    note: >-
      Chitral, Dir Kohistan, Diamer, Astore and Gilgit side valleys: steep slopes between the cold-desert
      valley floors and the dry deodar belt. Calibrated on GBIF calibration-cell records of Pinus gerardiana
      (10 of 14 inside, 13 within 5 km; ~3,900 km2). v0.2.2 ranked it below dry deodar and cold-desert
      scrub, which left it no cells at all; at priority 68 with a wide envelope it took 12,900 km2.
    priority: 64
