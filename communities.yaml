  # ---------------- Balochistan uplands (dry temperate / xeric) ----------------
  - id: ziarat_juniper
    structure: woodland_conifer
    ecoregion: juniper
    name: Ziarat juniper woodland
    group: Himalayan dry temperate forests (juniper)
    indicators: [Juniperus excelsa subsp. polycarpos, Fraxinus xanthoxyloides, Pistacia khinjuk, Artemisia maritima]
    where: {province: ["08", "10"], elev: [2000, null], slope: [4, null]}
    note: >-
      Ziarat, Zarghun, Khalifat, Takatu, Shaidu, Murdar, Chiltan; ~2,000-3,000 m in the literature, to
      the summits (v0.2.2 stopped at 3,000 m, leaving the Ziarat and Zarghun tops to the lowland-scrub
      fallback; a wild Juniperus record at Ziarat, 3,008 m, sat in that gap). LOW CONFIDENCE: only about
      a dozen wild Juniperus records in Balochistan (GBIF download 2026), so the extent rests mainly on
      the literature.
    priority: 70
  - id: chilgoza_pine
    structure: forest_conifer
    ecoregion: sulaiman_temperate
