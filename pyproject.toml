[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoregions"
version = "0.1.0"
description = "Revised Ecoregions of the World: fine-grained ecoregions built area by area"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
ecoregions = "ecoregions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
