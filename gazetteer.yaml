# Gazetteer of named physiographic units used to NAME L3 units and to CROSS-CHECK
# whether the delineation resolves them.
#
# Coordinates are approximate reference points (lon, lat; WGS84) placed from
# general geographic knowledge and standard maps, typically to ±5–10 km. They
# are anchors inside a feature, NOT boundaries. Correct or add points here and
# rerun `make names` — no code changes needed.
#
# Naming rule: a feature with an `expect` test names a unit only if the unit
# passes that test; otherwise it is listed under also_contains as not resolved
# at this scale (e.g. small inselbergs absorbed into a plains unit).
#
# Fields
#   name      display name (used verbatim for the L3 unit name)
#   kind      landform class (bar, doab, floodplain, desert, hills, range,
#             plateau, basin, valley, massif, coast, delta, plain, piedmont)
#   points    one or more anchor points; a feature spanning several L3 units
#             gets one name per unit with a positional suffix
#   priority  lower wins when several features fall in one L3 unit
#   check     include in the cross-check report (the list requested in the brief)
#   expect    character test for "resolved" (optional):
#               hand_class/min_frac, hand_min (median m), dune_min, relief_min/relief_max (5 km relief, m),
#               elev_min/elev_max (m), litho (group name substring), slope_min/slope_max (deg)
#   may_share names of features allowed to fall in the same L3 unit

features:
