# Ecoregion types: mappable aggregations of the communities above (each community
# names its type in `ecoregion`). Biomes follow RESOLVE Ecoregions 2017. Names as presented on maps:
# Title Case, "&" for "and", at most one place name (the region a type is centred on; when a type
# spreads beyond it, rename it to the enclosing region rather than adding another place). `resolve` lists
# the RESOLVE ecoregions a type can plausibly lie in (generous: RESOLVE is coarse, and
# neighbouring zones count); the audit flags ecoregions mostly outside them for review. Only the 12
# RESOLVE ecoregions that intersect Texas are used.
ecoregion_types:
  coastal_wetlands: {name: "Gulf Coast Marshes, Tidal Flats & Barrier Islands", biome: "Flooded Grasslands & Savannas", color: "#5f9fb5",
    resolve: ["Western Gulf coastal grasslands", "Tamaulipan mezquital"]}
  coastal_prairie: {name: "Gulf Coastal Prairies", biome: "Tropical & Subtropical Grasslands, Savannas & Shrublands", color: "#cfd98f",
    resolve: ["Western Gulf coastal grasslands", "East Central Texas forests", "Piney Woods", "Tamaulipan mezquital", "Texas blackland prairies"]}
  sand_sheet: {name: "South Texas Sand Sheet Grasslands", biome: "Tropical & Subtropical Grasslands, Savannas & Shrublands", color: "#efdca6",
    resolve: ["Tamaulipan mezquital", "Western Gulf coastal grasslands"]}
  rio_grande_delta: {name: "Rio Grande Delta Subtropical Woodlands", biome: "Tropical & Subtropical Dry Broadleaf Forests", color: "#6e9f4f",
    resolve: ["Tamaulipan mezquital", "Western Gulf coastal grasslands"]}
  tamaulipan: {name: "Tamaulipan Thornscrub", biome: "Deserts & Xeric Shrublands", color: "#a9874f",
    resolve: ["Tamaulipan mezquital", "Western Gulf coastal grasslands", "Edwards Plateau savanna", "East Central Texas forests", "Chihuahuan desert"]}
  bottomland: {name: "East Texas Bottomland Forests & Swamps", biome: "Temperate Broadleaf & Mixed Forests", color: "#3f7f6a",
    resolve: ["Piney Woods", "East Central Texas forests", "Western Gulf coastal grasslands", "Texas blackland prairies"]}
  piney_woods: {name: "Piney Woods Pine–Oak Forests", biome: "Temperate Conifer Forests", color: "#2e5e3e",
    resolve: ["Piney Woods", "East Central Texas forests"]}
  big_thicket: {name: "Big Thicket Longleaf Pine & Mixed Forests", biome: "Temperate Conifer Forests", color: "#5d8a3a",
    resolve: ["Piney Woods", "Western Gulf coastal grasslands", "East Central Texas forests"]}
  post_oak: {name: "Post Oak Savannas & Woodlands", biome: "Temperate Broadleaf & Mixed Forests", color: "#93ab5c",
    resolve: ["East Central Texas forests", "Piney Woods", "Texas blackland prairies", "Western Gulf coastal grasslands", "Tamaulipan mezquital"]}
  blackland: {name: "Blackland Tallgrass Prairie", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#a7a35a",
    resolve: ["Texas blackland prairies", "East Central Texas forests", "Cross-Timbers savanna-woodland", "Edwards Plateau savanna"]}
  cross_timbers: {name: "Cross Timbers Oak Woodlands", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#7a8f45",
    resolve: ["Cross-Timbers savanna-woodland", "Texas blackland prairies", "Central-Southern US mixed grasslands", "Edwards Plateau savanna"]}
  grand_prairie: {name: "Grand Prairie Midgrass Prairie & Oak–Juniper Hills", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#c2c27a",
    resolve: ["Cross-Timbers savanna-woodland", "Texas blackland prairies", "Edwards Plateau savanna", "Central-Southern US mixed grasslands"]}
  # Rainfall belts of the central band (regions/texas.yaml, assemble.zones): the Blackland, Post Oak, Cross Timbers
  # and Grand Prairie communities, regrouped by annual rainfall, because plant species there turn over east-west
  # with rain rather than across the north-south soil bands (finer GBIF test, 2026-11-11).
  central_savannas: {name: "Central Texas Oak Savannas & Prairies", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#b0a964",
    resolve: ["Texas blackland prairies", "Cross-Timbers savanna-woodland", "East Central Texas forests", "Edwards Plateau savanna",
              "Central-Southern US mixed grasslands", "Western Gulf coastal grasslands", "Tamaulipan mezquital"]}
  east_oak_prairies: {name: "East Texas Oak Woodlands & Tallgrass Prairies", biome: "Temperate Broadleaf & Mixed Forests", color: "#7d9c55",
    resolve: ["East Central Texas forests", "Texas blackland prairies", "Piney Woods", "Western Gulf coastal grasslands"]}
  plains_riparian: {name: "Southern Plains Riparian Forests", biome: "Temperate Broadleaf & Mixed Forests", color: "#5aa38a",
    resolve: ["Edwards Plateau savanna", "Cross-Timbers savanna-woodland", "Texas blackland prairies", "Central-Southern US mixed grasslands",
              "Western shortgrass prairie", "East Central Texas forests", "Western Gulf coastal grasslands"]}
  balcones: {name: "Balcones Canyonlands", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#4c6f5a",
    resolve: ["Edwards Plateau savanna", "Texas blackland prairies", "Tamaulipan mezquital"]}
  edwards: {name: "Edwards Plateau Oak–Juniper Woodlands & Savannas", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#9cae7c",
    resolve: ["Edwards Plateau savanna", "Central-Southern US mixed grasslands", "Tamaulipan mezquital", "Chihuahuan desert"]}
  stockton: {name: "Stockton Plateau Juniper & Lechuguilla Scrub", biome: "Deserts & Xeric Shrublands", color: "#b88c6a",
    resolve: ["Edwards Plateau savanna", "Chihuahuan desert", "Tamaulipan mezquital"]}
  llano: {name: "Llano Uplift Oak Woodlands & Granite Outcrops", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#c59b8f",
    resolve: ["Edwards Plateau savanna", "Cross-Timbers savanna-woodland"]}
  rolling_plains: {name: "Rolling Plains Mesquite–Juniper Shrublands & Breaks", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#b7aa6e",
    resolve: ["Central-Southern US mixed grasslands", "Western shortgrass prairie", "Cross-Timbers savanna-woodland", "Edwards Plateau savanna"]}
  sandhills: {name: "Shinnery Oak Sandhills", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#f0d58c",
    resolve: ["Western shortgrass prairie", "Central-Southern US mixed grasslands", "Chihuahuan desert"]}
  high_plains: {name: "High Plains Shortgrass Prairie & Playas", biome: "Temperate Grasslands, Savannas & Shrublands", color: "#e2d8a6",
    resolve: ["Western shortgrass prairie", "Central-Southern US mixed grasslands", "Chihuahuan desert"]}
  chihuahuan_scrub: {name: "Chihuahuan Desert Scrub", biome: "Deserts & Xeric Shrublands", color: "#ecd2b0",
    resolve: ["Chihuahuan desert", "Edwards Plateau savanna", "Western shortgrass prairie"]}
  desert_grassland: {name: "Chihuahuan Desert Grasslands", biome: "Deserts & Xeric Shrublands", color: "#c9a96e",
    resolve: ["Chihuahuan desert", "Sierra Madre Oriental pine-oak forests", "Arizona Mountains forests"]}
  pinyon_oak: {name: "Trans-Pecos Pinyon–Juniper–Oak Woodlands", biome: "Temperate Conifer Forests", color: "#7c8a62",
    resolve: ["Chihuahuan desert", "Sierra Madre Oriental pine-oak forests", "Arizona Mountains forests"]}
  montane_conifer: {name: "Trans-Pecos Montane Conifer Forests", biome: "Temperate Conifer Forests", color: "#284d3e",
    resolve: ["Sierra Madre Oriental pine-oak forests", "Arizona Mountains forests", "Chihuahuan desert"]}
  desert_riparian: {name: "Chihuahuan Desert Riparian Woodlands", biome: "Deserts & Xeric Shrublands", color: "#78b3a0",
    resolve: ["Chihuahuan desert", "Edwards Plateau savanna", "Western shortgrass prairie"]}

