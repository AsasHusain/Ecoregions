# Gazetteer of named physiographic units of Texas, used to NAME L3 units and to
# CROSS-CHECK whether the delineation resolves them (same schema as gazetteer.yaml).
#
# Names are those used by the Bureau of Economic Geology (Physiographic Map of
# Texas, 1996), the Handbook of Texas and Texans themselves. Coordinates are
# approximate reference points (lon, lat; WGS84) placed from town, peak and park
# coordinates (Wikipedia / GNIS) and standard maps, typically to ±5–10 km. They
# are anchors inside a feature, NOT boundaries; every point lies inside Texas
# (Natural Earth admin-1, US-TX). Never placed from EPA ecoregions or TPWD
# vegetation polygons (validation references only). Correct or add points here
# and rerun `make names` — no code changes needed.
#
# Naming rule: a feature with an `expect` test names a unit only if the unit
# passes that test; otherwise it is listed under also_contains as not resolved
# at this scale (e.g. a barrier island or a narrow river bottom absorbed into a
# plains unit). One place name per name: a feature spanning several named places
# takes the enclosing region's name, never a hyphen chain.
#
# Fields
#   name      display name (used verbatim for the L3 unit name)
#   kind      landform class (floodplain, desert, hills, range, plateau, basin,
#             valley, canyon, escarpment, massif, coast, island, lagoon, delta,
#             plain, prairie, woodland)
#   points    one or more anchor points; a feature spanning several L3 units
#             gets one name per unit with a positional suffix
#   priority  lower wins when several features fall in one L3 unit
#   check     include in the cross-check report
#   expect    character test for "resolved" (optional):
#               hand_class/min_frac, hand_min (median m), dune_min, relief_min/relief_max (5 km relief, m),
#               elev_min/elev_max (m), litho (group name substring, SGMC_GROUPS in covariates.py),
#               slope_min/slope_max (deg)
#   may_share names of features allowed to fall in the same L3 unit

